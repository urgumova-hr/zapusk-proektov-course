<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Запуск проектов</title>
<style>
/*
  ДИЗАЙН-ТОКЕНЫ (Konnektu AI brandbook: ультрамарин + сигнальный оранжевый)
  --navy        ультрамарин #392F9E — основной бренд-цвет: хедер, активные вкладки, кнопки "Далее"
  --navy-soft   #5B50C9 — вторичный акцент: чипы шагов, вторичные кнопки
  --ice / --ice-soft  светлые лавандовые тинты — фон карточек на светлой теме
  --accent      сигнальный оранжевый #FF4A1E — CTA, прогресс, правильный ответ, акцент упражнений
  --bg, --surface, --surface-2   фон страницы / карточек / вложенных блоков
  --text, --text-muted, --border  типографика и границы
  --ok, --bad   цвета результата теста/упражнения (верно / неверно)
  --radius-lg/-md/-sm   масштаб скругления карточка > чип > бейдж
  --gap-lg/-md/-sm      масштаб отступов между блоками
  Тема: светлая/тёмная через prefers-color-scheme + [data-theme], везде только через токены.
*/
:root{
  --navy:#392F9E; --navy-soft:#5B50C9; --ice:#D6D2F5; --ice-soft:#EFEDFB;
  --accent:#FF4A1E; --accent-soft:#FFD9CC;
  --bg:#F7F6FC; --surface:#FFFFFF; --surface-2:#F1EFFB;
  --text:#1F2430; --text-muted:#6B7280; --border:#E3E0F5;
  --ok:#1E8E5A; --ok-soft:#E3F6EC; --bad:#D63A2E; --bad-soft:#FBEAE8;
  --radius-lg:20px; --radius-md:14px; --radius-sm:9px;
  --gap-lg:28px; --gap-md:16px; --gap-sm:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161327; --surface:#1E1A35; --surface-2:#262042;
    --text:#EDEBFA; --text-muted:#A8A3C9; --border:#342D57;
    --ice:#2A2448; --ice-soft:#241F40; --navy:#8A80F0; --navy-soft:#6F64D9;
    --accent:#FF6A45; --accent-soft:#3A2420;
    --ok:#4FD896; --ok-soft:#163327; --bad:#FF6B5E; --bad-soft:#3A1E1C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161327; --surface:#1E1A35; --surface-2:#262042;
  --text:#EDEBFA; --text-muted:#A8A3C9; --border:#342D57;
  --ice:#2A2448; --ice-soft:#241F40; --navy:#8A80F0; --navy-soft:#6F64D9;
  --accent:#FF6A45; --accent-soft:#3A2420;
  --ok:#4FD896; --ok-soft:#163327; --bad:#FF6B5E; --bad-soft:#3A1E1C;
  color-scheme:dark;
}

*{box-sizing:border-box;}
body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
#app{max-width:880px; margin:0 auto; padding:0 16px; padding-block:var(--gap-lg) 60px; display:flex; flex-direction:column; gap:var(--gap-lg); min-width:0;}

a{color:var(--navy);}

.brand{display:flex; align-items:baseline; gap:2px; font-weight:800; font-size:13px; letter-spacing:.04em;}
.brand b{color:var(--text);}
.brand span{color:var(--accent);}

.hero{display:flex; flex-direction:column; gap:10px;}
.hero h1{margin:0; font-size:clamp(24px,5vw,34px); font-weight:800; color:var(--navy); text-wrap:balance;}
.hero p{margin:0; color:var(--text-muted); font-size:15px; max-width:640px;}

.progress-wrap{display:flex; align-items:center; gap:12px;}
.progress-bar{flex:1; height:10px; border-radius:99px; background:var(--surface-2); overflow:hidden; min-width:0;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--navy),var(--accent)); border-radius:99px; transition:width .3s;}
.progress-label{font-size:13px; color:var(--text-muted); white-space:nowrap; font-variant-numeric:tabular-nums;}

.tabs{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin;}
.tab{flex:0 0 auto; padding:9px 14px; border-radius:99px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px;}
.tab[aria-selected="true"]{background:var(--navy); color:#fff; border-color:var(--navy);}
.tab .dot{width:7px; height:7px; border-radius:50%; background:var(--border); flex:none;}
.tab .dot.done{background:var(--ok);}
.tab .dot.active-dot{background:var(--accent);}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:clamp(18px,4vw,30px); min-width:0;}

.module-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.module-head h2{margin:0; font-size:clamp(20px,4vw,26px); color:var(--text); text-wrap:balance;}
.module-kicker{font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--navy-soft); text-transform:uppercase;}
.badge{font-size:11px; font-weight:700; padding:4px 10px; border-radius:99px; white-space:nowrap;}
.badge.pass{background:var(--ok-soft); color:var(--ok);}
.badge.fail{background:var(--bad-soft); color:var(--bad);}
.badge.todo{background:var(--surface-2); color:var(--text-muted);}

.m-content{margin-top:var(--gap-md); display:flex; flex-direction:column; gap:14px; font-size:15px; line-height:1.55;}
.m-content h3{margin:10px 0 2px; font-size:16px; color:var(--navy);}
.m-content p{margin:0; color:var(--text);}
.m-content ul{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px;}
.callout{background:var(--ice-soft); border-left:3px solid var(--navy); border-radius:var(--radius-sm); padding:12px 14px; font-size:14px;}
.callout b{color:var(--navy);}

.fact-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px;}
.fact{background:var(--ice-soft); border-radius:var(--radius-sm); padding:10px 12px;}
.fact .k{font-weight:700; font-size:13px; color:var(--navy);}
.fact .v{font-size:12.5px; color:var(--text-muted); margin-top:2px;}

.step-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px;}
.step{background:var(--surface-2); border-radius:var(--radius-sm); padding:10px 12px; display:flex; gap:10px; align-items:flex-start;}
.step .code{flex:none; width:34px; height:34px; border-radius:50%; background:var(--navy); color:#fff; font-weight:800; font-size:12.5px; display:flex; align-items:center; justify-content:center;}
.step.optional .code{background:var(--navy-soft);}
.step .txt b{display:block; font-size:13px;}
.step .txt span{font-size:12px; color:var(--text-muted);}

.cmp-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:560px){.cmp-grid{grid-template-columns:1fr;}}
.cmp{border-radius:var(--radius-md); padding:14px; color:#fff;}
.cmp.box{background:var(--navy);}
.cmp.custom{background:var(--accent);}
.cmp h4{margin:0 0 8px; font-size:14px;}
.cmp ul{margin:0; padding-left:18px; font-size:12.5px; line-height:1.5; display:flex; flex-direction:column; gap:4px;}

.tbl-wrap{overflow-x:auto; border-radius:var(--radius-sm); border:1px solid var(--border);}
table.data{width:100%; border-collapse:collapse; font-size:13px; min-width:420px;}
table.data th{background:var(--navy); color:#fff; text-align:left; padding:8px 10px; font-weight:600;}
table.data td{padding:8px 10px; border-bottom:1px solid var(--border); color:var(--text);}
table.data tr:nth-child(even) td{background:var(--ice-soft);}

.btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
button.btn{font-family:inherit; border:none; border-radius:99px; padding:11px 20px; font-size:14px; font-weight:700; cursor:pointer;}
button.btn.primary{background:var(--accent); color:#fff;}
button.btn.secondary{background:var(--surface-2); color:var(--text);}
button.btn.ghost{background:transparent; color:var(--navy); border:1px solid var(--border);}
button.btn.small{padding:7px 14px; font-size:12.5px;}
button.btn:disabled{opacity:.45; cursor:not-allowed;}
button.btn.primary:hover{filter:brightness(1.05);}

.quiz-q{display:flex; flex-direction:column; gap:10px; padding:14px 0; border-top:1px solid var(--border);}
.quiz-q:first-of-type{border-top:none; padding-top:0;}
.quiz-q .qtext{font-weight:700; font-size:14.5px;}
.opt{display:flex; align-items:flex-start; gap:10px; border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; cursor:pointer; font-size:14px; background:var(--surface);}
.opt input{margin-top:2px; accent-color:var(--navy); flex:none;}
.opt.correct{border-color:var(--ok); background:var(--ok-soft);}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft);}
.opt.disabled{cursor:default;}

.score-box{display:flex; flex-direction:column; align-items:center; gap:6px; padding:18px; border-radius:var(--radius-md); background:var(--surface-2); text-align:center;}
.score-box .big{font-size:40px; font-weight:800; font-variant-numeric:tabular-nums;}
.score-box.pass .big{color:var(--ok);}
.score-box.fail .big{color:var(--bad);}

.note{font-size:12.5px; color:var(--text-muted);}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:5px 10px; border-radius:99px; background:var(--surface-2); color:var(--text-muted);}

.admin-row{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
.who{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-muted);}
.who .av{width:26px; height:26px; border-radius:50%; background:var(--navy); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none;}

.overview-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
.mcard{border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; background:var(--surface); cursor:pointer; display:flex; flex-direction:column; gap:8px; min-width:0;}
.mcard:hover{border-color:var(--navy);}
.mcard .num{font-size:11px; font-weight:800; color:var(--navy-soft); letter-spacing:.05em;}
.mcard h4{margin:0; font-size:15px;}
.mcard p{margin:0; font-size:12.5px; color:var(--text-muted);}

footer.pagefoot{text-align:center; font-size:12px; color:var(--text-muted); padding-top:10px;}

/* ---------------- Exercises (ungraded/self-check practice, separate from the tracked quiz) ---------------- */
.ex-block{border:1px dashed var(--border); border-radius:var(--radius-md); padding:16px; margin-top:10px; background:var(--surface);}
.ex-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
.ex-title{font-weight:800; font-size:13.5px; color:var(--accent); text-transform:uppercase; letter-spacing:.03em;}
.ex-instr{font-size:13px; color:var(--text-muted); margin:0 0 10px;}
.ex-result{margin-top:10px; font-size:13px; font-weight:700; padding:8px 12px; border-radius:var(--radius-sm);}
.ex-result.good{background:var(--ok-soft); color:var(--ok);}
.ex-result.bad{background:var(--bad-soft); color:var(--bad);}

.seq-pool, .seq-answer{display:flex; flex-wrap:wrap; gap:8px; min-height:44px; padding:8px; border-radius:var(--radius-sm); background:var(--surface-2);}
.seq-answer{border:1px dashed var(--border);}
.seq-chip{background:var(--navy); color:#fff; font-size:12.5px; font-weight:600; padding:8px 12px; border-radius:99px; cursor:pointer; border:none;}
.seq-chip.placed{background:var(--navy-soft);}
.seq-chip.ok{background:var(--ok);}
.seq-chip.bad{background:var(--bad);}
.seq-label{font-size:11.5px; color:var(--text-muted); margin:10px 0 4px; text-transform:uppercase; letter-spacing:.04em;}

.match-row{display:flex; align-items:center; gap:10px; padding:7px 0; flex-wrap:wrap;}
.match-row .lbl{flex:1 1 220px; font-size:13.5px; min-width:0;}
.match-row select{flex:1 1 220px; min-width:0; padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:13px; font-family:inherit;}
.match-row.ok select{border-color:var(--ok);}
.match-row.bad select{border-color:var(--bad);}
.match-mark{font-size:15px; flex:none; width:18px; text-align:center;}

.choice-card{background:var(--surface-2); border-radius:var(--radius-sm); padding:12px; margin-bottom:10px;}
.choice-card .ctext{font-size:13.5px; font-weight:600; margin-bottom:8px;}
.choice-btns{display:flex; gap:8px; flex-wrap:wrap;}
.choice-btn{border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:99px; cursor:pointer;}
.choice-btn.ok{background:var(--ok-soft); border-color:var(--ok); color:var(--ok);}
.choice-btn.bad{background:var(--bad-soft); border-color:var(--bad); color:var(--bad);}
.choice-fb{font-size:12.5px; color:var(--text-muted); margin-top:8px;}

.ms-opt{display:flex; align-items:flex-start; gap:8px; padding:7px 0; font-size:13.5px; cursor:pointer;}
.ms-opt input{margin-top:3px; accent-color:var(--navy); flex:none;}
.ms-opt.ok{color:var(--ok);}
.ms-opt.bad{color:var(--bad);}

.chk-item{display:flex; align-items:flex-start; gap:8px; padding:6px 0; font-size:13.5px;}
.chk-item input{margin-top:3px; accent-color:var(--accent); flex:none;}

.idbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 16px; margin-bottom:16px;}
.idbar .idlabel{font-size:13px; color:var(--text-muted); flex:none;}
.idbar input[type=text]{flex:1; min-width:160px; font-family:inherit; font-size:13.5px; padding:8px 12px; border-radius:99px; border:1px solid var(--border); background:var(--surface-2); color:var(--text);}
.idbar .idsaved{font-size:13.5px; font-weight:700; color:var(--text);}
.idbar .idsaved span{font-weight:400; color:var(--text-muted);}
.idbar .idwarn{font-size:12px; color:var(--bad);}
</style>

<style>html{-webkit-text-size-adjust:100%}body{margin:0;font-size:14px;line-height:1.45}[hidden]{display:none!important}</style>
</head>
<body>
<div id="app">
  <div class="brand"><b>KONNEKTU</b><span>AI</span></div>

  <div class="hero">
    <h1>Запуск проектов — курс</h1>
    <p>Самостоятельное изучение регламента запуска клиентских проектов: 7 модулей, в каждом — учебный материал, практические упражнения на закрепление и короткий тест. Курс дополняет презентацию руководителя и работает без LMS — прямо по ссылке.</p>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-label" id="progressLabel">0 / 7 модулей пройдено</div>
    </div>
  </div>

  <div class="idbar" id="idBar"></div>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div id="main"></div>

  <footer class="pagefoot" id="whoFoot"></footer>
</div>

<script>
(function(){

// ---------------------------------------------------------------
// CONTENT: 7 modules grounded in «Регламент запуска клиентских
// проектов» (Konnektu AI, финальная версия сент. 2026), презентации
// руководителя и «Реестре документов Запуск проектов Konnektu».
// Каждый модуль: учебный материал (html) + практические упражнения
// (exercises, самопроверка, не отправляются в отчёт) + тест из 5
// вопросов (quiz, результат сохраняется централизованно).
// ---------------------------------------------------------------
var MODULES = [
{
  id:"m1", num:1, title:"Жизненный цикл и ключевые термины",
  blurb:"Что считается «запуском» и где он находится в жизненном цикле проекта",
  html: '' +
    '<p>Регламент устанавливает единый порядок запуска клиентских проектов в Konnektu AI: последовательность этапов, состав обязательных документов, роли участников и правила хранения документации. Он распространяется на всех сотрудников, участвующих в запуске и последующем сопровождении проектов клиентов.</p>' +
    '<h3>Что входит в понятие «запуск проекта»</h3>' +
    '<p><b>Запуск проекта</b> — это этапы <b>«Подготовка» (A)</b> и <b>«Запуск проекта» (B)</b>, а также первый проход этапа <b>«Планирование цикла» (C)</b>, в рамках которого формируются техническое задание и Fit-Gap первого цикла работ. Результат запуска — согласованный и утверждённый комплект из пяти обязательных документов и готовность проектной группы приступить к первому циклу.</p>' +
    '<div class="callout"><b>До запуска:</b> проект проходит пресейл (P0–P15) — квалификация лида, диагностика, оценка, коммерческое предложение. На шаге <b>P15</b> результаты пресейла передаются руководителю проекта и становятся входными данными этапа «Подготовка».</div>' +
    '<div class="callout"><b>После запуска:</b> проект переходит в регулярный операционный режим — ежедневные (D), еженедельные (E) и ежемесячные (F) действия РП, закрытие цикла (G) и возврат к планированию следующего цикла (C).</div>' +
    '<h3>Ключевые термины</h3>' +
    '<div class="fact-grid">' +
      '<div class="fact"><div class="k">РП</div><div class="v">Руководитель проекта — отвечает за поставку результата в рамках объёма, сроков, бюджета и качества</div></div>' +
      '<div class="fact"><div class="k">АМ / КС</div><div class="v">Аккаунт-менеджер / менеджер клиентского сервиса — коммерческие отношения, договор, удержание клиента</div></div>' +
      '<div class="fact"><div class="k">ПГ</div><div class="v">Проектная группа — закреплённый перечень сотрудников, работающих над проектом клиента</div></div>' +
      '<div class="fact"><div class="k">PMO</div><div class="v">Проектный офис — стандарты управления, ревью готовности запуска, контроль качества планов</div></div>' +
      '<div class="fact"><div class="k">Box / Custom</div><div class="v">Коробочный запуск без доработок / кастомизированный запуск с полным циклом Fit-Gap и ТЗ</div></div>' +
      '<div class="fact"><div class="k">Fit-Gap</div><div class="v">Анализ соответствия требований штатному функционалу (Fit) и нужных доработок (Gap)</div></div>' +
      '<div class="fact"><div class="k">Цикл</div><div class="v">Управляемая единица реализации проекта с результатами, границами и критериями завершения</div></div>' +
    '</div>',
  exercises:[
    { type:"sequence", title:"Упражнение · собери жизненный цикл",
      instr:"Нажимайте на карточки в правильном хронологическом порядке — от первого контакта с клиентом до закрытия проекта.",
      items:[
        {id:"presale", label:"Лид и пресейл (P0–P15)"},
        {id:"a", label:"Подготовка (A)"},
        {id:"b", label:"Запуск проекта (B)"},
        {id:"c", label:"Планирование цикла (C)"},
        {id:"defg", label:"Регулярные циклы (D·E·F·G)"},
        {id:"hi", label:"Закрытие проекта (H·I)"}
      ],
      order:["presale","a","b","c","defg","hi"]
    }
  ],
  quiz:[
    {q:"Что входит в понятие «Запуск проекта» согласно Регламенту?", opts:["Только этап B. Запуск проекта","Этапы A и B целиком, плюс первый проход этапа C (Планирование цикла)","Все этапы от пресейла до закрытия проекта","Только подготовка договора и Устава"], a:1},

// "Запуск проектов — результаты". См. инструкцию по развёртыванию,
// переданную вместе с файлом курса.
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzN3lUUx4aQ94sc1bluJyc3btCkbpG1LPq9MBI7r0pr72Qsus0IK7pVPMB9G2-jJA/exec";

function el(html){ var d=document.createElement("div"); d.innerHTML=html; return d.firstElementChild; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function passedCount(){
  var n=0; MODULES.forEach(function(m){ if(state.results[m.id] && state.results[m.id].passed) n++; });
  return n;
}

function renderProgress(){
  var n = passedCount(), total = MODULES.length;
  document.getElementById("progressFill").style.width = (100*n/total)+"%";
  document.getElementById("progressLabel").textContent = n+" / "+total+" модулей пройдено";
}

function renderTabs(){
  var wrap = document.getElementById("tabs");
  wrap.innerHTML = "";
  var overviewTab = el('<button class="tab" role="tab">Обзор курса</button>');
  overviewTab.setAttribute("aria-selected", state.view==="overview" ? "true":"false");
  overviewTab.onclick = function(){ state.view="overview"; render(); };
  wrap.appendChild(overviewTab);

  MODULES.forEach(function(m, i){
    var r = state.results[m.id];
    var dotClass = r ? (r.passed ? "done" : "") : "";
    var isActive = state.view==="module" && state.moduleIdx===i;
    var btn = el('<button class="tab" role="tab"><span class="dot '+dotClass+(isActive?" active-dot":"")+'"></span>'+(i+1)+'. '+esc(m.title.split(" ").slice(0,2).join(" "))+'</button>');
    btn.setAttribute("aria-selected", isActive ? "true":"false");
    btn.onclick = function(){ state.view="module"; state.moduleIdx=i; state.showQuiz=false; render(); };
    wrap.appendChild(btn);
  });
}

function renderOverview(){
  var cards = MODULES.map(function(m,i){
    var r = state.results[m.id];
    var badge = r ? (r.passed ? '<span class="badge pass">пройден · '+r.score+'/'+r.total+'</span>' : '<span class="badge fail">не сдан · '+r.score+'/'+r.total+'</span>') : '<span class="badge todo">не начат</span>';
    var c = el('<div class="mcard"><div class="num">МОДУЛЬ '+(i+1)+'</div><h4>'+esc(m.title)+'</h4><p>'+esc(m.blurb)+'</p>'+badge+'</div>');
    c.onclick = function(){ state.view="module"; state.moduleIdx=i; state.showQuiz=false; render(); };
    return c;
  });
  var container = el('<div class="card"><h2 style="margin:0 0 4px;">'+MODULES.length+' модулей курса</h2><p class="note" style="margin-bottom:14px;">Изучите материал модуля, закрепите упражнениями, затем пройдите тест (нужно 4 правильных ответа из 5). В отчёт попадает только результат теста.</p><div class="overview-grid"></div></div>');
  var grid = container.querySelector(".overview-grid");
  cards.forEach(function(c){ grid.appendChild(c); });
  return container;
}

function renderModule(){
  var m = MODULES[state.moduleIdx];
  var r = state.results[m.id];
  var badge = r ? (r.passed ? '<span class="badge pass">пройден · '+r.score+'/'+r.total+'</span>' : '<span class="badge fail">не сдан · '+r.score+'/'+r.total+'</span>') : '<span class="badge todo">тест не пройден</span>';
  var card = el('<div class="card">'+
    '<div class="module-head"><div><div class="module-kicker">Модуль '+m.num+' из '+MODULES.length+'</div><h2>'+esc(m.title)+'</h2></div><span id="moduleBadge">'+badge+'</span></div>'+
    '<div class="m-content">'+m.html+'</div>'+
    '<div id="exArea"></div>'+
    '<div class="btnrow" id="moduleActions"></div>'+
    '<div id="quizArea" style="margin-top:18px;"></div>'+
  '</div>');

  var exArea = card.querySelector("#exArea");
  (m.exercises||[]).forEach(function(ex){ exArea.appendChild(renderExercise(ex)); });

  var actions = card.querySelector("#moduleActions");
  var quizBtn = el('<button class="btn primary">Пройти тест модуля ('+m.quiz.length+' вопросов)</button>');
  quizBtn.onclick = function(){ state.showQuiz=true; render(); };
  actions.appendChild(quizBtn);

  if(state.moduleIdx>0){
    var prev = el('<button class="btn ghost">← Предыдущий модуль</button>');
    prev.onclick=function(){ state.moduleIdx--; state.showQuiz=false; render(); };
    actions.appendChild(prev);
  }
  if(state.moduleIdx<MODULES.length-1){
    var next = el('<button class="btn secondary">Следующий модуль →</button>');
    next.onclick=function(){ state.moduleIdx++; state.showQuiz=false; render(); };
    actions.appendChild(next);
  }

  if(state.showQuiz){
    card.querySelector("#quizArea").appendChild(buildQuizDom(m));
  }
  return card;
}

function exShell(title, instr){
  return el('<div class="ex-block"><div class="ex-head"><span class="ex-title">'+esc(title)+'</span></div><p class="ex-instr">'+esc(instr)+'</p><div class="ex-body"></div></div>');
}

function renderExercise(ex){
  if(ex.type==="sequence") return buildSequenceExercise(ex);
  if(ex.type==="match") return buildMatchExercise(ex);
  if(ex.type==="choice") return buildChoiceExercise(ex);
  if(ex.type==="multiselect") return buildMultiselectExercise(ex);
  if(ex.type==="checklist") return buildChecklistExercise(ex);
  return document.createTextNode("");
}

function buildSequenceExercise(ex){
  var shell = exShell(ex.title, ex.instr);
  var body = shell.querySelector(".ex-body");
  var pool = shuffle(ex.items);
  var answer = [];

  var poolLabel = el('<div class="seq-label">Доступные шаги</div>');
  var poolEl = el('<div class="seq-pool"></div>');
  var ansLabel = el('<div class="seq-label">Ваш порядок</div>');
  var ansEl = el('<div class="seq-answer"></div>');
  var result = el('<div style="display:none;" class="ex-result"></div>');
  var btnRow = el('<div class="btnrow"></div>');
  var checkBtn = el('<button class="btn primary small">Проверить порядок</button>');
  var resetBtn = el('<button class="btn secondary small">Сбросить</button>');
  btnRow.appendChild(checkBtn); btnRow.appendChild(resetBtn);

  function renderChips(){
    poolEl.innerHTML = "";
    pool.forEach(function(item){
      var chip = el('<button type="button" class="seq-chip">'+esc(item.label)+'</button>');
      chip.onclick = function(){
        pool = pool.filter(function(it){ return it.id!==item.id; });
        answer.push(item);
        renderChips(); renderAnswer();
      };
      poolEl.appendChild(chip);
    });
  }
  function renderAnswer(){
    ansEl.innerHTML = "";
    answer.forEach(function(item, idx){
      var chip = el('<button type="button" class="seq-chip placed">'+(idx+1)+'. '+esc(item.label)+'</button>');
      chip.onclick = function(){
        answer = answer.filter(function(it){ return it.id!==item.id; });
        pool.push(item);
        renderChips(); renderAnswer();
      };
      ansEl.appendChild(chip);
    });
    result.style.display = "none";
  }
  checkBtn.onclick = function(){
    if(answer.length !== ex.order.length){
      result.style.display="block"; result.className="ex-result bad"; result.textContent="Сначала расставьте все элементы.";
      return;
    }
    var ok = answer.every(function(item, idx){ return item.id===ex.order[idx]; });
    ansEl.querySelectorAll(".seq-chip").forEach(function(chip, idx){
      chip.classList.add(answer[idx].id===ex.order[idx] ? "ok" : "bad");
    });
    result.style.display="block";
    result.className = "ex-result " + (ok?"good":"bad");
    result.textContent = ok ? "Верно! Порядок собран правильно." : "Есть ошибки — неверные позиции подсвечены красным. Нажмите на них, чтобы переставить.";
  };
  resetBtn.onclick = function(){ pool = shuffle(ex.items); answer=[]; renderChips(); renderAnswer(); };

  body.appendChild(poolLabel); body.appendChild(poolEl);
  body.appendChild(ansLabel); body.appendChild(ansEl);
  body.appendChild(btnRow); body.appendChild(result);
  renderChips(); renderAnswer();
  return shell;
}

function buildMatchExercise(ex){
  var shell = exShell(ex.title, ex.instr);
  var body = shell.querySelector(".ex-body");
  var selects = {};
  ex.rows.forEach(function(row){
    var rowEl = el('<div class="match-row"><div class="lbl">'+esc(row.label)+'</div></div>');
    var opts = shuffle(ex.options);
    var sel = el('<select><option value="">— выберите —</option></select>');
    opts.forEach(function(o){ sel.appendChild(el('<option value="'+esc(o)+'">'+esc(o)+'</option>')); });
    var mark = el('<span class="match-mark"></span>');
    rowEl.appendChild(sel); rowEl.appendChild(mark);
    selects[row.id] = { select: sel, row: rowEl, mark: mark };
    body.appendChild(rowEl);
  });
  var result = el('<div style="display:none;" class="ex-result"></div>');
  var checkBtn = el('<button class="btn primary small">Проверить</button>');
  var btnRow = el('<div class="btnrow"></div>'); btnRow.appendChild(checkBtn);
  body.appendChild(btnRow); body.appendChild(result);

  checkBtn.onclick = function(){
    var right=0, total=ex.rows.length;
    ex.rows.forEach(function(row){
      var s = selects[row.id];
      var v = s.select.value;
      var isOk = v === ex.correct[row.id];
      s.row.classList.remove("ok","bad");
      s.row.classList.add(isOk?"ok":"bad");
      s.mark.textContent = isOk ? "✓" : "✕";
      if(isOk) right++;
    });
    result.style.display="block";
    result.className = "ex-result " + (right===total?"good":"bad");
    result.textContent = "Правильно: "+right+" из "+total+(right===total?" — отлично!":". Поправьте отмеченные строки и проверьте снова.");
  };
  return shell;
}

function buildChoiceExercise(ex){
  var shell = exShell(ex.title, ex.instr);
  var body = shell.querySelector(".ex-body");
  ex.questions.forEach(function(q){
    var card = el('<div class="choice-card"><div class="ctext">'+esc(q.text)+'</div><div class="choice-btns"></div><div class="choice-fb" style="display:none;"></div></div>');
    var btns = card.querySelector(".choice-btns");
    var fb = card.querySelector(".choice-fb");
    var answered = false;
    q.options.forEach(function(opt, idx){
      var b = el('<button type="button" class="choice-btn">'+esc(opt)+'</button>');
      b.onclick = function(){
        if(answered) return;
        answered = true;
        Array.prototype.forEach.call(btns.children, function(bb, i){
          if(i===q.correct) bb.classList.add("ok");
          else if(i===idx) bb.classList.add("bad");
        });
        fb.style.display="block";
        fb.textContent = (idx===q.correct ? "Верно. " : "Неверно. ") + (q.fb||"");
      };
      btns.appendChild(b);
    });
    body.appendChild(card);
  });
  return shell;
}

function buildMultiselectExercise(ex){
  var shell = exShell(ex.title, ex.instr);
  var body = shell.querySelector(".ex-body");
  var boxes = {};
  ex.options.forEach(function(o){
    var row = el('<label class="ms-opt"><input type="checkbox"/><span>'+esc(o.label)+'</span></label>');
    boxes[o.id] = { input: row.querySelector("input"), row: row, o:o };
    body.appendChild(row);
  });
  var result = el('<div style="display:none;" class="ex-result"></div>');
  var checkBtn = el('<button class="btn primary small">Проверить</button>');
  var btnRow = el('<div class="btnrow"></div>'); btnRow.appendChild(checkBtn);
  body.appendChild(btnRow); body.appendChild(result);
  checkBtn.onclick = function(){
    var allOk = true;
    Object.keys(boxes).forEach(function(id){
      var b = boxes[id];
      var isOk = b.input.checked === b.o.correct;
      b.row.classList.remove("ok","bad");
      b.row.classList.add(isOk?"ok":"bad");
      if(!isOk) allOk=false;
    });
    result.style.display="block";
    result.className="ex-result "+(allOk?"good":"bad");
    result.textContent = allOk ? "Верно! Отмечены все нужные документы и только они." : "Есть ошибки — неверные строки подсвечены.";
  };
  return shell;
}

function buildChecklistExercise(ex){
  var shell = exShell(ex.title, ex.instr);
  var body = shell.querySelector(".ex-body");
  ex.items.forEach(function(text){
    body.appendChild(el('<label class="chk-item"><input type="checkbox"/><span>'+esc(text)+'</span></label>'));
  });
  return shell;
}

// ---------------------------------------------------------------
// QUIZ (tracked — result saved to the backend)
// ---------------------------------------------------------------
function buildQuizDom(m){
  var wrap = el('<div></div>');
  wrap.appendChild(el('<h3 style="margin:4px 0 0; color:var(--navy);">Тест: '+esc(m.title)+'</h3>'));

  m.quiz.forEach(function(q, qi){
    var qdiv = el('<div class="quiz-q"><div class="qtext">'+(qi+1)+'. '+esc(q.q)+'</div></div>');
    q.opts.forEach(function(opt, oi){
      var label = el('<label class="opt"><input type="radio" name="q'+qi+'" value="'+oi+'"/><span>'+esc(opt)+'</span></label>');
      qdiv.appendChild(label);
    });
    wrap.appendChild(qdiv);
  });

  var btnRow = el('<div class="btnrow"></div>');
  var submit = el('<button class="btn primary">Проверить ответы</button>');
  var msg = el('<span class="note" style="align-self:center;"></span>');
  btnRow.appendChild(submit); btnRow.appendChild(msg);
  wrap.appendChild(btnRow);

  submit.onclick = function(){
    var answers = [];
    var missing = false;
    m.quiz.forEach(function(q, qi){
      var checked = wrap.querySelector('input[name="q'+qi+'"]:checked');
      if(!checked){ missing = true; answers.push(null); }
      else answers.push(parseInt(checked.value,10));
    });
    if(missing){ msg.textContent = "Ответьте на все вопросы, прежде чем проверить."; return; }
    msg.textContent = "";
    gradeQuizInPlace(wrap, m, answers);
  };

  return wrap;
}

function gradeQuizInPlace(wrap, m, answers){
  var score = 0;
  var qDivs = wrap.querySelectorAll(".quiz-q");
  m.quiz.forEach(function(q, qi){
    if(answers[qi]===q.a) score++;
    var opts = qDivs[qi].querySelectorAll(".opt");
    opts.forEach(function(optEl, oi){
      optEl.classList.add("disabled");
      optEl.querySelector("input").disabled = true;
      if(oi===q.a) optEl.classList.add("correct");
      else if(oi===answers[qi]) optEl.classList.add("wrong");
    });
  });
  var total = m.quiz.length;
  var passed = score/total >= PASS_RATIO;
  state.results[m.id] = { score:score, total:total, passed:passed, ts:Date.now() };
  renderProgress();
  renderTabs();
  var badgeEl = document.getElementById("moduleBadge");
  if(badgeEl) badgeEl.innerHTML = passed ? '<span class="badge pass">пройден · '+score+'/'+total+'</span>' : '<span class="badge fail">не сдан · '+score+'/'+total+'</span>';

  wrap.querySelector(".btnrow").remove();
  var box = el('<div class="score-box '+(passed?"pass":"fail")+'"><div class="big">'+score+' / '+total+'</div><div>'+(passed?"Тест пройден":"Нужно набрать минимум 4 из 5 — попробуйте снова")+'</div></div>');
  wrap.appendChild(box);
  if(!state.userName){
    wrap.appendChild(el('<div class="idwarn" style="margin-top:8px;">Результат не попадёт в общий отчёт — укажите имя в поле наверху страницы.</div>'));
  } else if(state.saveWarning){
    wrap.appendChild(el('<div class="idwarn" style="margin-top:8px;">'+esc(state.saveWarning)+'</div>'));
  }
  var retry = el('<button class="btn secondary" style="margin-top:12px;">Пройти тест ещё раз</button>');
  retry.onclick = function(){ render(); };
  wrap.appendChild(retry);

  persistResult(m.id, state.results[m.id]);
}

// ---------------------------------------------------------------
// MAIN RENDER
// ---------------------------------------------------------------
function render(){
  renderTabs();
  renderProgress();
  renderIdBar();
  var main = document.getElementById("main");
  main.innerHTML = "";
  if(state.view==="overview") main.appendChild(renderOverview());
  else if(state.view==="module") main.appendChild(renderModule());

  var foot = document.getElementById("whoFoot");
  foot.textContent = APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === 0
    ? "Центральный учёт результатов пока не подключен (см. инструкцию для администратора курса)"
    : "Результаты тестов сохраняются в общую Google-таблицу курса";
}

// ---------------------------------------------------------------
// ИДЕНТИФИКАЦИЯ (без логина)
// Курс размещён на внешнем хостинге без LMS и без авторизации, поэтому
// личность сотрудника — это пара значений в localStorage его браузера:
// kzp_uid (случайный технический id) и kzp_name (имя, которое он один раз
// вводит сам). Это позволяет вести сводный учёт в Google-таблице, но
// значит, что прогресс не переносится между устройствами/браузерами —
// это ограничение внешнего хостинга без логина, см. сопроводительное
// письмо.
// ---------------------------------------------------------------
function uuidFallback(){
  return "u"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10);
}
function getOrCreateUid(){
  try{
    var id = localStorage.getItem("kzp_uid");
    if(!id){
      id = (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : uuidFallback();
      localStorage.setItem("kzp_uid", id);
    }
    return id;
  }catch(e){ return uuidFallback(); }
}
function getStoredName(){
  try{ return localStorage.getItem("kzp_name") || ""; }catch(e){ return ""; }
}
function setStoredName(name){
  try{ localStorage.setItem("kzp_name", name); }catch(e){}
}

function renderIdBar(){
  var bar = document.getElementById("idBar");
  if(!bar) return;
  bar.innerHTML = "";
  if(state.userName){
    bar.appendChild(el('<div class="idsaved">Вы: '+esc(state.userName)+' <span>— результаты тестов сохраняются на это имя. '+
      '<a href="#" id="idChange" style="color:var(--navy); text-decoration:underline;">изменить</a></span></div>'));
    bar.querySelector("#idChange").onclick = function(ev){
      ev.preventDefault();
      state.userName = ""; setStoredName("");
      renderIdBar();
    };
    return;
  }
  var row = el('<div style="display:flex; flex-wrap:wrap; align-items:center; gap:10px; width:100%;">'+
    '<span class="idlabel">Укажите имя и фамилию — так результаты тестов попадут в общий отчёт:</span>'+
    '<input type="text" id="nameInput" placeholder="Имя Фамилия" />'+
    '<button class="btn primary small" id="nameSave">Сохранить</button>'+
    '</div>');
  bar.appendChild(row);
  var input = row.querySelector("#nameInput");
  var save = function(){
    var v = (input.value||"").trim();
    if(!v){ input.focus(); return; }
    state.userName = v; setStoredName(v);
    renderIdBar();
    loadMyResults();
  };
  row.querySelector("#nameSave").onclick = save;
  input.addEventListener("keydown", function(ev){ if(ev.key==="Enter") save(); });
}

// ---------------------------------------------------------------
// БЭКЕНД: Google Таблица + Apps Script
// persistResult/loadMyResults обращаются к веб-приложению Apps Script,
// привязанному к Google-таблице курса (см. APPS_SCRIPT_URL выше и
// инструкцию по развёртыванию). Запрос отправляется БЕЗ заголовка
// Content-Type, чтобы браузер не делал предварительный OPTIONS-запрос
// (preflight), который Apps Script не обрабатывает, — тело при этом
// всё равно содержит JSON и разбирается как JSON на сервере.
// Если сохранение не удалось (нет сети, скрипт не развёрнут и т.п.),
// результат теста всё равно показывается локально — отправка просто
// повторится при следующем действии пользователя.
// ---------------------------------------------------------------
function backendReady(){
  return APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf("PASTE_YOUR") !== 0;
}

function persistResult(moduleId, result){
  if(!backendReady() || !state.userName || !state.userId) return;
  state.saveWarning = "";
  fetch(APPS_SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      userId: state.userId,
      userName: state.userName,
      moduleId: moduleId,
      score: result.score,
      total: result.total,
      passed: !!result.passed
    })
  }).catch(function(){
    state.saveWarning = "Результат сохранён локально, но не отправлен в общий отчёт (проверьте подключение к интернету).";
  });
}

function loadMyResults(){
  if(!backendReady() || !state.userId) return;
  fetch(APPS_SCRIPT_URL+"?action=mydata&userId="+encodeURIComponent(state.userId))
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data && data.modules){ state.results = data.modules; render(); }
    }).catch(function(){});
}

function init(){
  state.userId = getOrCreateUid();
  state.userName = getStoredName();
  render();
  if(state.userName) loadMyResults();
}

init();
})();
</script>
